plugins {
    id 'com.android.application'
}

android {
    namespace 'com.quantum.superball'
    compileSdk 34

    defaultConfig {
        applicationId 'com.quantum.superball'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_shared' }
        }
    }

    externalNativeBuild {
        cmake { path file('../../CMakeLists.txt') }
    }
}
